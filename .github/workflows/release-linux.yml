name: Linux build and release

on:
  pull_request:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and attach Linux packages to
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: linux-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out pull request or selected release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || format('refs/tags/{0}', inputs.tag || github.ref_name) }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
          cache: npm
      - name: Validate selected tag and package version
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version tag: ${RELEASE_TAG}"
            exit 1
          fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "::error::Tag ${RELEASE_TAG} does not exist on origin"
            exit 1
          fi
          version="$(node -p "require('./package.json').version")"
          if [[ "${RELEASE_TAG}" != "v${version}" ]]; then
            echo "::error::Tag ${RELEASE_TAG} does not match package.json version ${version}"
            exit 1
          fi
      - name: Install Electron runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0 libnss3 libasound2t64 libgbm1 xvfb
      - name: Install dependencies
        run: npm ci
      - name: Smoke test Electron native modules
        run: xvfb-run -a npm run smoke:electron -- --no-sandbox
      - name: Build Linux packages
        run: npm run dist:linux
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify package artifacts and bundled resources
        id: artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          appimage="release/IRFlow-Timeline-${version}-x86_64.AppImage"
          deb="release/IRFlow-Timeline-${version}-amd64.deb"
          hayabusa="release/linux-unpacked/resources/hayabusa/hayabusa"
          rules="release/linux-unpacked/resources/hayabusa/rules"
          bmc_tools="release/linux-unpacked/resources/tools/bmc-tools/bmc-tools.py"

          for path in "${appimage}" "${deb}" "${hayabusa}" "${rules}" "${bmc_tools}"; do
            if [ ! -e "${path}" ]; then
              echo "::error::Missing expected Linux release output: ${path}"
              exit 1
            fi
          done
          test -s "${appimage}"
          test -s "${deb}"
          test -d "${rules}"
          test -x "${appimage}"
          test -x "${hayabusa}"
          "${hayabusa}" help >/dev/null
          python3 "${bmc_tools}" -h >/dev/null
          if find release/linux-unpacked -name app-update.yml -print -quit | grep -q .; then
            echo "::error::Linux package unexpectedly contains an updater configuration"
            exit 1
          fi

          echo "appimage=${appimage}" >> "${GITHUB_OUTPUT}"
          echo "deb=${deb}" >> "${GITHUB_OUTPUT}"
      - name: Retain Linux build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages-${{ github.run_id }}
          path: |
            ${{ steps.artifacts.outputs.appimage }}
            ${{ steps.artifacts.outputs.deb }}
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download verified Linux packages
        uses: actions/download-artifact@v4
        with:
          name: linux-packages-${{ github.run_id }}
          path: release-assets
      - name: Create release if needed and upload Linux packages
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          appimage="release-assets/IRFlow-Timeline-${version}-x86_64.AppImage"
          deb="release-assets/IRFlow-Timeline-${version}-amd64.deb"
          test -s "${appimage}"
          test -s "${deb}"

          if ! gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            create_args=(
              --verify-tag
              --title "IRFlow Timeline ${version}"
              --notes "Linux AppImage and Debian packages for IRFlow Timeline ${RELEASE_TAG}."
              --latest=false
            )
            if [[ "${RELEASE_TAG}" == *-* ]]; then
              create_args+=(--prerelease)
            fi

            # A macOS release job may create this release while Linux packaging runs.
            # Continue after a failed create only when a release now exists for this tag.
            if ! gh release create "${RELEASE_TAG}" "${create_args[@]}" \
              --repo "${GITHUB_REPOSITORY}"; then
              gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null
            fi
          fi

          # Preserve any existing release title, notes, and other platform assets.
          gh release upload "${RELEASE_TAG}" "${appimage}" "${deb}" \
            --repo "${GITHUB_REPOSITORY}" --clobber
